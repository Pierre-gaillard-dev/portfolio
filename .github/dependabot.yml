version: 2
updates:
  # npm ecosystem also covers pnpm (reads pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/apps/*']
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
